<ion-header>
  <ion-toolbar>
    <ion-title>ARABAZON</ion-title>
  </ion-toolbar>
</ion-header>

<ion-content>
  <ion-card>
    <ion-card-header>
      <ion-card-title>Welcome to ARABAZON</ion-card-title>
      <ion-card-subtitle>Your favorite e-commerce platform</ion-card-subtitle>
    </ion-card-header>
    <ion-card-content>
      <p>Discover amazing products from local shops.</p>
    </ion-card-content>
  </ion-card>

  <ion-grid>
    <ion-row>
      <ion-col size="6">
        <ion-button expand="block" routerLink="/tabs/products">
          <ion-icon name="storefront" slot="start"></ion-icon>
          Browse Products
        </ion-button>
      </ion-col>
      <ion-col size="6">
        <ion-button expand="block" fill="outline" routerLink="/tabs/cart">
          <ion-icon name="basket" slot="start"></ion-icon>
          View Cart
        </ion-button>
      </ion-col>
    </ion-row>
  </ion-grid>
</ion-content>
